<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
  position: relative;
  text-align: center;
  }

.checkbox {
  /* display: none; */
}

.checkbox {
  width: 20px;
  height: 20px;
  border: 2px solid #ddd;
  position: absolute;
  top: 100px;
  left: 100px;
}

#checkbox1 {
  transform: rotate(0deg) translate(4rem);
}
#checkbox2 {
  transform: rotate(30deg) translate(4rem);
}
#checkbox3 {
  transform: rotate(60deg) translate(4rem);
}
#checkbox4 {
  transform: rotate(90deg) translate(4rem);
}
#checkbox5 {
  transform: rotate(120deg) translate(4rem);
}
#checkbox6 {
  transform: rotate(150deg) translate(4rem);
}
#checkbox7 {
  transform: rotate(180deg) translate(4rem);
}
#checkbox8 {
  transform: rotate(210deg) translate(4rem);
}
#checkbox9 {
  transform: rotate(240deg) translate(4rem);
}
#checkbox10 {
  transform: rotate(270deg) translate(4rem);
}
#checkbox11 {
  transform: rotate(300deg) translate(4rem);
}
#checkbox12 {
  transform: rotate(330deg) translate(4rem);
}
.checkbox:checked {
  background-color: #ddd;
}

/* .element {
  transform: rotate(45deg) translate(50px, 50px) scale(1.5, 1.5) skew(10deg, 20deg);
} */

  </style>
</head>
<body>
  
  <div class="container">
      <input type="checkbox" id="checkbox1" class="checkbox"/>
      <label for="checkbox1"></label>
      <input type="checkbox" id="checkbox2" class="checkbox"/>
      <label for="checkbox2"></label>
      <input type="checkbox" id="checkbox3" class="checkbox"/>
      <label for="checkbox3"></label>
      <input type="checkbox" id="checkbox4" class="checkbox"/>
      <label for="checkbox4"></label>
      <input type="checkbox" id="checkbox5" class="checkbox"/>
      <label for="checkbox5"></label>
      <input type="checkbox" id="checkbox6" class="checkbox"/>
      <label for="checkbox6"></label>
      <input type="checkbox" id="checkbox7" class="checkbox"/>
      <label for="checkbox7"></label>
      <input type="checkbox" id="checkbox8" class="checkbox"/>
      <label for="checkbox8"></label>
      <input type="checkbox" id="checkbox9" class="checkbox"/>
      <label for="checkbox9"></label>
      <input type="checkbox" id="checkbox10" class="checkbox"/>
      <label for="checkbox10"></label>
      <input type="checkbox" id="checkbox11" class="checkbox"/>
      <label for="checkbox11"></label>
      <input type="checkbox" id="checkbox12" class="checkbox"/>
      <label for="checkbox12"></label>
  </div>
  
</body>
</html>
