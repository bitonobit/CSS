<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox</title>
  <style>
    .flex-container{
      display: flex;
      background-color: lightblue;
      height: 250px;
      /* flex-direction: row;
      flex-wrap: wrap;  */
      flex-flow: row wrap;
      justify-content: space-around;
      align-items: center;     
    }
    .flex-container>div{
      background-color: lightcoral;
      margin: 10px;
      padding: 20px;
      font-size: 30px;
    }
    .div1{
      flex-grow: 1;
    }
    .div2{
      flex-grow: 2; 
      /* Ocupará dos partes del espacio disponible */
    }
    .div3{
      flex-grow: 5; 
      /* Ocupará cinco partes del espacio disponible */
    }
    .div4{
      flex-grow: 1;
    }
  </style>
</head>
<body>
  <!-- Contenedor -->
   <div class="flex-container">
    <div class="div1">1</div>
    <div class="div2">2</div>
    <div class="div3">3</div>
    <div class="div4">4</div>
   </div>
</body>
</html>
