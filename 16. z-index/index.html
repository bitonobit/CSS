<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capas</title>
    <style>
        .container{
            position: relative;
            background-color: lightgoldenrodyellow;
        }
        .c1{
            position: relative;
            background-color: lightblue;
            width: 200px;
            height: 100px;
            top: 10px;
            left: 10px;
            z-index: 1;
        }
        .c2{
            position: absolute;
            background-color: lightcoral;
            width: 250px;
            height: 50px;
            top: 25px;
            left: 50px;
            z-index: 2;
        }
        .c3{
            position: absolute;
            background-color: lightgreen;
            width: 200px;
            height: 100px;
            top: 50px;
            z-index: 3;
        }
        .c4{
            position: absolute;
            background-color: lightsalmon;
            width: 100px;
            height: 150px;
            left: 30px;
            z-index: 4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="c1">1</div>
        <div class="c2">2</div>
        <div class="c3">3</div>
        <div class="c4">4</div>
    </div>
</body>
</html>
