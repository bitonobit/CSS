<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propiedad Display</title>
    <style>
        .flex-container {
            background-color: lightblue;
            margin: 1px;
            display: flex;
        }

        .flex-item {
            background-color: lightcoral;
            width: 100px;
            /* height: 100px; */
            margin: 1px;
        }
        .invisible {
            display: none;
        }
        img{
            max-width: 80px;
        }
    </style>
</head>

<body>
    <div class="flex-container">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
        <div class="flex-item">4</div>
        <div class="flex-item">5</div>
        <div class="flex-item">6</div>
    </div>

    <div class="flex-container">
        <img src="img/catrina-farrell-79Qa_Zr-iEs-unsplash.jpg" class="flex-item">
        <img src="img/colter-olmstead-Z8wKh9wHrwg-unsplash.jpg" class="flex-item">
        <img src="img/gabor-juhasz-B1Zyw7sdm5w-unsplash.jpg" class="flex-item">
        <img src="img/ioann-mark-kuznietsov-eHlVZcSrjfg-unsplash.jpg" class="flex-item">
        <img src="img/maria-orlova-x3Z_YxnUh54-unsplash.jpg" class="flex-item">
        <img src="img/sergey-shmidt-koy6FlCCy5s-unsplash.jpg" class="flex-item">
    </div>

</body>

</html>
