<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas con estilo</title>
    <style>
        ul {
            list-style-type: none;
            /* list-style-position: outside; */
            margin: 0;
            padding: 0;
            background-color: lightcoral;
        }

        li {
            background-color: lightblue;
            display: inline-block;
            margin: 1rem;
            width: 50px;
        }
    </style>
</head>

<body>
    <ul>
        <li>Html</li>
        <li>Css</li>
        <li>Js</li>
        <li>Php</li>
        <li>MySql</li>
    </ul>
</body>

</html>
